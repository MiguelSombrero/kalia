# Update-PR half of ADR-0024 — the vulnerability-scan CI job is the gate;
# this is what fixes findings before they ever reach it. The Docker
# ecosystems keep the tags the Dockerfiles and docker-compose.yml already use
# rather than pinning digests: Trivy scans the built images.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      # react and react-dom must stay on the exact same version — React
      # fails fast at runtime otherwise — but Dependabot updates each
      # package independently by default. Grouping forces them into one PR.
      react:
        patterns:
          - "react"
          - "react-dom"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/keycloak"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
