name: CI

# Runs on every branch push so suites are green before a PR is opened
# (see CLAUDE.md workflow); manual dispatch for re-runs.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Pushing a follow-up commit makes the previous run's result irrelevant, so
# cancel it rather than let both race to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed to diff against the base branch rather than one commit.
          fetch-depth: 0
      - id: filter
        name: Decide which suites this push can affect
        # Fails open on purpose: anything this cannot classify with certainty
        # (a push to dev, a first push with no merge base, a shared root file
        # like docker-compose.yml or this workflow) runs everything. A missed
        # run is a broken merge; a redundant run costs a few free minutes.
        run: |
          if [ "${GITHUB_REF_NAME}" = "dev" ] || [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "on ${GITHUB_REF_NAME}: running everything"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base=$(git merge-base origin/dev HEAD 2>/dev/null || true)
          if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
            echo "no usable merge base with origin/dev: running everything"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'

          # Files outside backend/ and frontend/ that either suite depends on.
          # docker-compose.yml builds and wires both; this workflow defines
          # how they run.
          shared=$(echo "$changed" | grep -E '^(docker-compose\.yml|\.github/workflows/)' || true)

          # Written as `if` blocks rather than `cmd && var=true`: steps run
          # under `bash -e`, where a grep that legitimately matches nothing
          # is a non-zero exit, and whether that aborts the script depends on
          # subtleties of how `-e` treats `&&` lists. `if` conditions are
          # explicitly exempt.
          backend=false
          frontend=false
          if [ -n "$shared" ]; then
            backend=true
            frontend=true
          fi
          if echo "$changed" | grep -q '^backend/'; then backend=true; fi
          if echo "$changed" | grep -q '^frontend/'; then frontend=true; fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "Result: backend=$backend frontend=$frontend"

  adr-index-check:
    name: ADR index check
    # No backend/frontend build tooling involved, so this runs unconditionally
    # rather than behind the changes filter above — docs/ isn't classified by
    # that filter at all, and the check itself costs a few seconds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify ADR index and structure (see ADR-0019)
        run: node scripts/check-adrs.mjs

  task-index-check:
    name: Task index check
    # Unconditional for the same reason as the ADR check above: docs/ isn't
    # classified by the changes filter, and this costs a few seconds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify task files and iteration indexes (see ADR-0026)
        run: node scripts/check-tasks.mjs

  backend:
    name: Backend (Maven)
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Ryuk is Testcontainers' reaper: it removes containers the JVM leaves
      # behind. A GitHub-hosted runner is destroyed when the job ends, so
      # there is nothing for it to reap — and skipping it removes one Docker
      # Hub pull, which is one fewer chance to fail for reasons unrelated to
      # the code. Never set this locally, where cleanup does matter.
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers pulls this image on first use, mid-test-run, where a
      # slow Docker Hub response fails the whole build: that happened on
      # 2026-07-25 with the code unchanged. Pulling it up front lets a
      # transient registry failure be retried instead of failing CI.
      - name: Pre-pull Testcontainers images
        run: |
          for attempt in 1 2 3; do
            if docker pull postgres:18.4; then exit 0; fi
            echo "::warning::docker pull failed (attempt $attempt/3), retrying"
            sleep $((attempt * 15))
          done
          echo "::error::could not pull postgres:18.4 after 3 attempts"
          exit 1
      # Testcontainers uses the Docker daemon preinstalled on ubuntu-latest.
      # verify runs surefire (*Test units), failsafe (*IT integrations) and
      # the merged JaCoCo report.
      - name: Build and test
        run: mvn -B verify
      - name: Coverage summary
        run: |
          python3 - <<'EOF'
          import csv
          covered = missed = 0
          with open('target/site/jacoco-merged/jacoco.csv') as f:
              for row in csv.DictReader(f):
                  covered += int(row['INSTRUCTION_COVERED']); missed += int(row['INSTRUCTION_MISSED'])
          total = covered + missed
          pct = 100 * covered / total
          aim = ' (aim: >= 80 %, see backend/README.md)' if pct < 80 else ''
          print(f'Instruction coverage: {pct:.1f}% ({covered}/{total}){aim}')
          EOF

  frontend:
    name: Frontend (npm)
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  api-client-drift:
    name: API client drift check
    # Watches both sides deliberately: the drift this catches (ADR-0012) is
    # generated code that no longer matches the backend's spec, which a
    # backend-only filter would miss when the generated files themselves are
    # edited. Not gated behind the backend job — it builds the backend image
    # itself, so waiting only delays the answer without changing it.
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Start backend
        working-directory: .
        run: docker compose up -d --build backend postgres
      - name: Wait for backend health
        working-directory: .
        run: timeout 120 sh -c 'until curl -sf http://localhost:8080/actuator/health; do sleep 2; done'
      - name: Regenerate API client
        run: npm run generate:api
      - name: Fail if the committed client has drifted from the live spec
        run: git diff --exit-code -- lib/api/generated

  vulnerability-scan:
    # Deliberately not gated behind `changes` (contrast api-client-drift and
    # e2e above): a dependency already in this branch can gain a CVE the
    # moment one is disclosed, with no code change at all, so "did this push
    # touch backend/frontend" is the wrong question. Runs on every push
    # unconditionally; vulnerability-scan.yml also runs it on a daily
    # schedule so a quiet week without a push doesn't leave a newly
    # disclosed CVE undetected (ADR-0024).
    uses: ./.github/workflows/vulnerability-scan.yml

  e2e:
    name: E2E (Playwright)
    # The slowest job, so it starts as soon as the change areas are known
    # rather than queueing behind the cheap ones. It would fail anyway if
    # they fail, and on a public repo the redundant minutes are free — while
    # the serial wait was paid on every green run, which is most of them.
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # Starts the full docker compose stack itself (playwright.config.ts);
      # GitHub Actions sets CI=true, so it always starts fresh.
      - name: Run E2E tests
        run: npm run test:e2e
