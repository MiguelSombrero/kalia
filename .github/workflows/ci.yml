name: CI

# Runs on every branch push so suites are green before a PR is opened
# (see CLAUDE.md workflow); manual dispatch for re-runs.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers uses the Docker daemon preinstalled on ubuntu-latest.
      # verify runs surefire (*Test units), failsafe (*IT integrations) and
      # the merged JaCoCo report.
      - name: Build and test
        run: mvn -B verify
      - name: Coverage summary
        run: |
          python3 - <<'EOF'
          import csv
          covered = missed = 0
          with open('target/site/jacoco-merged/jacoco.csv') as f:
              for row in csv.DictReader(f):
                  covered += int(row['INSTRUCTION_COVERED']); missed += int(row['INSTRUCTION_MISSED'])
          total = covered + missed
          pct = 100 * covered / total
          aim = ' (aim: >= 80 %, see backend/README.md)' if pct < 80 else ''
          print(f'Instruction coverage: {pct:.1f}% ({covered}/{total}){aim}')
          EOF

  frontend:
    name: Frontend (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  api-client-drift:
    name: API client drift check
    # Gated behind backend (fail fast); catches the exact drift this task
    # exists to prevent - generated code committed to the repo that no
    # longer matches the backend's actual OpenAPI spec (ADR-0012).
    needs: [backend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Start backend
        working-directory: .
        run: docker compose up -d --build backend postgres
      - name: Wait for backend health
        working-directory: .
        run: timeout 120 sh -c 'until curl -sf http://localhost:8080/actuator/health; do sleep 2; done'
      - name: Regenerate API client
        run: npm run generate:api
      - name: Fail if the committed client has drifted from the live spec
        run: git diff --exit-code -- lib/api/generated

  e2e:
    name: E2E (Playwright)
    # Gated behind the cheap checks (fail fast); this job is the slowest —
    # full docker compose build + container startup + browser tests.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # Starts the full docker compose stack itself (playwright.config.ts);
      # GitHub Actions sets CI=true, so it always starts fresh.
      - name: Run E2E tests
        run: npm run test:e2e
