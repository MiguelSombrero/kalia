name: CI

# Runs on every branch push so suites are green before a PR is opened
# (see CLAUDE.md workflow); manual dispatch for re-runs.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Pushing a follow-up commit makes the previous run's result irrelevant, so
# cancel it rather than let both race to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # docker-compose.base.yml has no default for this one, on purpose (ADR-0054):
  # the whole file is interpolated regardless of which services a job
  # targets, so every job that touches the compose files needs it — a
  # value that stays inside one ephemeral runner and is never asserted
  # against, unlike scripts/check-keycloak-signin.mjs's testuser/testuser123.
  # Every other secret comes from docker-compose.dev.env (ADR-0089).
  KALIA_WEB_CLIENT_SECRET: ci-run-not-a-credential

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      mobile-e2e: ${{ steps.filter.outputs.mobile-e2e }}
      keycloak: ${{ steps.filter.outputs.keycloak }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed to diff against the base branch rather than one commit.
          fetch-depth: 0
      - id: filter
        name: Decide which suites this push can affect
        # Fails open on purpose: anything this cannot classify with certainty
        # (a push to dev, a first push with no merge base, a shared root file
        # like docker-compose.yml or this workflow) runs everything. A missed
        # run is a broken merge; a redundant run costs a few free minutes.
        run: |
          everything() {
            echo "$1: running everything"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            echo "mobile-e2e=true" >> "$GITHUB_OUTPUT"
            echo "keycloak=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "${GITHUB_REF_NAME}" = "dev" ] || [ "${GITHUB_REF_NAME}" = "main" ]; then
            everything "on ${GITHUB_REF_NAME}"
          fi

          base=$(git merge-base origin/dev HEAD 2>/dev/null || true)
          if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
            everything "no usable merge base with origin/dev"
          fi

          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'

          # Files outside backend/ and web/ that either suite depends on.
          # the docker-compose.* files build and wire both; this workflow defines
          # how they run; .node-version pins the Node every web job
          # installs; docs/architecture.md is asserted against the
          # backend's actual modules by ArchitectureDocumentationTest;
          # keycloak/, postgres/ and the seed script with its helper feed the
          # keycloak, postgres and keycloak-seed services e2e's stack starts;
          # edge/ is the proxy every request to that stack passes through.
          shared=$(echo "$changed" | grep -E '^(docker-compose\.|\.github/workflows/|docs/architecture\.md|\.node-version|\.dockerignore|edge/|keycloak/|postgres/|scripts/(seed-keycloak-account|keycloak-admin)\.mjs)' || true)

          # What keycloak-realm-check below can be affected by: the services
          # it starts and the scripts it runs. Neither backend/ nor web/
          # is among them.
          keycloak_inputs=$(echo "$changed" | grep -E '^(docker-compose\.|\.github/workflows/|edge/|keycloak/|postgres/|scripts/(seed-keycloak-account|keycloak-admin|check-keycloak-signin|check-keycloak-realm-config|check-keycloak-pkce-flow)\.mjs)' || true)

          # Written as `if` blocks rather than `cmd && var=true`: steps run
          # under `bash -e`, where a grep that legitimately matches nothing
          # is a non-zero exit, and whether that aborts the script depends on
          # subtleties of how `-e` treats `&&` lists. `if` conditions are
          # explicitly exempt.
          backend=false
          web=false
          mobile=false
          mobile_e2e=false
          keycloak=false
          if [ -n "$shared" ]; then
            backend=true
            web=true
            mobile=true
            mobile_e2e=true
          fi
          if [ -n "$keycloak_inputs" ]; then keycloak=true; fi
          if echo "$changed" | grep -q '^backend/'; then backend=true; fi
          # backend/openapi.json is what packages/api generates from, so a change to
          # it is a change to what the web compiles even though it sits in backend/.
          if echo "$changed" | grep -qE '^(web/|packages/|package(-lock)?\.json$|backend/openapi\.json$)'; then web=true; fi
          # The mobile app compiles the same packages, and type-checks against
          # the same generated client, so it follows them.
          if echo "$changed" | grep -qE '^(mobile/|packages/|package(-lock)?\.json$|backend/openapi\.json$|Makefile$|scripts/mobile-env)'; then mobile=true; fi

          # The flow drives the built app against the whole stack, so it also
          # follows the backend, which no other mobile job does.
          if echo "$changed" | grep -qE '^(mobile/|packages/|backend/|package(-lock)?\.json$|Makefile$|scripts/(mobile-e2e|mobile-env|stack-ports))'; then mobile_e2e=true; fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          echo "mobile-e2e=$mobile_e2e" >> "$GITHUB_OUTPUT"
          echo "keycloak=$keycloak" >> "$GITHUB_OUTPUT"
          echo "Result: backend=$backend web=$web mobile=$mobile mobile-e2e=$mobile_e2e keycloak=$keycloak"

  static-checks:
    name: Static checks
    # Unconditional: these read docs/, scripts/, backend/src and web/
    # together, and the changes filter above classifies none of that as one
    # unit — a backend `domain` type can land in a push it calls
    # web-only. The whole set takes about a second, so one job running
    # the Makefile's list keeps that list in exactly one place.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Run every dependency-free checker and its fixture self-test
        run: make check
      # Renders the compose files, which needs the docker CLI but no daemon.
      # Here rather than in `make check` so that stays Docker-free.
      - name: Check the deployable compose file refuses without a secret
        run: make compose-check

  backend:
    name: Backend (Maven)
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Ryuk is Testcontainers' reaper: it removes containers the JVM leaves
      # behind. A GitHub-hosted runner is destroyed when the job ends, so
      # there is nothing for it to reap — and skipping it removes one Docker
      # Hub pull, which is one fewer chance to fail for reasons unrelated to
      # the code. Never set this locally, where cleanup does matter.
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers pulls this image on first use, mid-test-run, where a
      # slow Docker Hub response fails the whole build: that happened on
      # 2026-07-25 with the code unchanged. Pulling it up front lets a
      # transient registry failure be retried instead of failing CI.
      - name: Pre-pull Testcontainers images
        run: |
          for attempt in 1 2 3; do
            if docker pull postgres:18.4; then exit 0; fi
            echo "::warning::docker pull failed (attempt $attempt/3), retrying"
            sleep $((attempt * 15))
          done
          echo "::error::could not pull postgres:18.4 after 3 attempts"
          exit 1
      # Testcontainers uses the Docker daemon preinstalled on ubuntu-latest.
      # verify runs surefire (*Test units), failsafe (*IT integrations) and
      # the merged JaCoCo report.
      - name: Build and test
        run: mvn -B verify
      - name: Coverage summary
        run: |
          python3 - <<'EOF'
          import csv
          covered = missed = 0
          with open('target/site/jacoco-merged/jacoco.csv') as f:
              for row in csv.DictReader(f):
                  covered += int(row['INSTRUCTION_COVERED']); missed += int(row['INSTRUCTION_MISSED'])
          total = covered + missed
          pct = 100 * covered / total
          aim = ' (aim: >= 80 %, see backend/README.md)' if pct < 80 else ''
          print(f'Instruction coverage: {pct:.1f}% ({covered}/{total}){aim}')
          EOF

  web:
    name: Web and packages (npm)
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      # The Makefile's targets, so the list of what runs lives in one place:
      # the web app and both shared packages are linted and tested.
      - name: Lint
        run: make lint
      - name: Test
        run: make web-test packages-test
      - name: Build
        run: make web-build

  mobile:
    name: Mobile app (npm)
    # Lint, strict type check and Jest unit tests: the same targets as
    # `make verify-fast`, and nothing that needs a simulator or a native
    # build (ADR-0096).
    needs: [changes]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint and type-check
        run: make mobile-lint
      - name: Test
        run: make mobile-test

  api-client-drift:
    name: API client drift check
    # Regenerates the shared client from the committed spec and diffs it
    # (ADR-0093); neither needs the backend running, so no Docker. That the
    # committed spec matches what the application serves is the backend job's
    # CommittedOpenApiSpecIT. Watches both sides deliberately: the generated
    # files edited by hand, or the spec edited without regenerating, both
    # show up here.
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Fail if the committed client differs from what the committed spec generates
        run: make api-drift

  api-breaking-change:
    name: API breaking-change check
    # Diffs backend/openapi.json against dev's copy and fails on a change an
    # installed app would notice (ADR-0093). Only the spec and the files that
    # configure the diff matter, but a push to dev or a shared file runs
    # everything, so this follows the backend filter.
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      # oasdiff, by release and checksum from its checksums.txt: a download
      # that does not match fails the job rather than running.
      OASDIFF_VERSION: 1.35.0
      OASDIFF_SHA256: a8023002fcb2eaa7f5758148a9303cb63d33b939886df312268bc0fc7b939140
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base spec comes from origin/dev's history, not this branch's.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install oasdiff
        run: |
          curl -sSfL -o "$RUNNER_TEMP/oasdiff.tar.gz" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  $RUNNER_TEMP/oasdiff.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/oasdiff"
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP/oasdiff" oasdiff
          echo "$RUNNER_TEMP/oasdiff" >> "$GITHUB_PATH"
      - name: Fail on a breaking change against dev's spec
        run: node scripts/check-api-breaking.mjs origin/dev

  keycloak-realm-check:
    name: Keycloak realm check
    needs: [changes]
    if: needs.changes.outputs.keycloak == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # quay.io returned 503 on the keycloak pull in one outage and turned
      # three PRs red (docs/ci-playbook.md); the backend job's loop above
      # retries the same way, so a transient registry failure costs a wait
      # rather than a run.
      - name: Pre-pull compose images
        working-directory: .
        run: |
          for attempt in 1 2 3; do
            if docker compose pull --ignore-buildable postgres keycloak-config keycloak-seed && docker pull "$(awk '/^FROM/ {print $2; exit}' keycloak/Dockerfile)" && docker pull "$(awk '/^FROM/ {print $2; exit}' edge/Dockerfile)"; then exit 0; fi
            echo "::warning::docker pull failed (attempt $attempt/3), retrying"
            sleep $((attempt * 15))
          done
          echo "::error::could not pull the compose images after 3 attempts"
          exit 1
      - name: Start Keycloak and Postgres
        run: docker compose up -d --build --wait --wait-timeout 120 postgres keycloak edge
      - name: Seed the demo account
        run: docker compose up -d --build keycloak-seed
      - name: Verify the realm accepts sign-in, not just a healthy container
        run: node scripts/check-keycloak-signin.mjs testuser testuser123
      - name: Verify the imported realm matches every value keycloak/realm-export.json pins
        run: node scripts/check-keycloak-realm-config.mjs
      - name: Verify the mobile client signs in with PKCE and gets the backend audience
        run: node scripts/check-keycloak-pkce-flow.mjs testuser testuser123
      # Recreated rather than restarted: a restart keeps the container's own
      # filesystem, so only a fresh container proves the account lives in
      # Postgres. --no-deps leaves keycloak-seed alone, so nothing re-creates
      # the account behind the check's back.
      - name: Verify accounts survive a fresh Keycloak container
        run: |
          docker compose up -d --force-recreate --no-deps --wait --wait-timeout 120 keycloak
          node scripts/check-keycloak-signin.mjs testuser testuser123

  vulnerability-scan:
    # Deliberately not gated behind `changes` (contrast api-client-drift and
    # e2e above): a dependency already in this branch can gain a CVE the
    # moment one is disclosed, with no code change at all, so "did this push
    # touch backend/web" is the wrong question. Runs on every push
    # unconditionally; vulnerability-scan.yml also runs it on a daily
    # schedule so a quiet week without a push doesn't leave a newly
    # disclosed CVE undetected (ADR-0024).
    uses: ./.github/workflows/vulnerability-scan.yml

  e2e:
    name: E2E (Playwright)
    # The slowest job, so it starts as soon as the change areas are known
    # rather than queueing behind the cheap ones. It would fail anyway if
    # they fail, and on a public repo the redundant minutes are free — while
    # the serial wait was paid on every green run, which is most of them.
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        working-directory: .
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # quay.io returned 503 on the keycloak pull in one outage and turned
      # three PRs red (docs/ci-playbook.md); the backend job's loop above
      # retries the same way, so a transient registry failure costs a wait
      # rather than a run.
      - name: Pre-pull compose images
        working-directory: .
        run: |
          for attempt in 1 2 3; do
            if docker compose pull --ignore-buildable && docker pull "$(awk '/^FROM/ {print $2; exit}' keycloak/Dockerfile)" && docker pull "$(awk '/^FROM/ {print $2; exit}' edge/Dockerfile)"; then exit 0; fi
            echo "::warning::docker pull failed (attempt $attempt/3), retrying"
            sleep $((attempt * 15))
          done
          echo "::error::could not pull the compose images after 3 attempts"
          exit 1
      # Starts the full docker compose stack itself (playwright.config.ts);
      # GitHub Actions sets CI=true, so it always starts fresh. The last spec
      # to run, e2e/edge-limits.spec.ts, is the burst check against the edge
      # proxy's limits (ADR-0090).
      - name: Run E2E tests
        run: npm run test:e2e
      # Playwright's own error-context.md is an ARIA-snapshot of the page at
      # the moment a locator timed out — printed straight into the job log
      # (readable here, unlike the artifact below) rather than only saved to
      # a file, so a failure is diagnosable without downloading anything.
      - name: Print Playwright error context
        if: failure()
        run: |
          find test-results -name "error-context.md" -print -exec cat {} \; || true
      # A failure's trace/screenshot (playwright.config.ts's "on-first-retry")
      # otherwise dies with the runner — nothing this repo already does
      # uploads it, so a red run today is undiagnosable after the fact.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  mobile-e2e:
    name: Mobile E2E (Maestro, Android)
    # The flow in mobile/.maestro/ against the whole stack on an Android
    # emulator (ADR-0096). A failed flow is not retried: a retry would hide a
    # flaky required check, so a red run is read and logged instead
    # (docs/common-failures.md).
    needs: [changes]
    if: needs.changes.outputs.mobile-e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      # Expo's setup names JDK 17 for a local Android build.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm ci
      # Same retry as the e2e job's pull: a registry outage is a wait, not a run.
      - name: Pre-pull compose images
        run: |
          for attempt in 1 2 3; do
            if docker compose pull --ignore-buildable && docker pull "$(awk '/^FROM/ {print $2; exit}' keycloak/Dockerfile)" && docker pull "$(awk '/^FROM/ {print $2; exit}' edge/Dockerfile)"; then exit 0; fi
            echo "::warning::docker pull failed (attempt $attempt/3), retrying"
            sleep $((attempt * 15))
          done
          echo "::error::could not pull the compose images after 3 attempts"
          exit 1
      # Not the whole stack: the web app is no part of the flow, and a one-shot
      # service that exits (keycloak-seed) made `--wait` fail on the runner.
      # Retried like the pull above: the backend image's `mvn dependency:go-offline`
      # reaches Maven Central from inside the build, and one unreachable run
      # failed the job with no app involved. A real build error fails all three.
      - name: Start the stack the app talks to
        run: |
          for attempt in 1 2 3; do
            if docker compose up -d --build --wait --wait-timeout 300 edge backend keycloak; then exit 0; fi
            echo "::warning::starting the stack failed (attempt $attempt/3), retrying"
            sleep $((attempt * 15))
          done
          echo "::error::could not start the stack after 3 attempts"
          exit 1
      # The Maestro version is pinned in the script, and the cached directory is
      # named after it, so a new pin cannot restore the old binary.
      - name: Read the pinned Maestro version
        id: maestro
        run: echo "version=$(node --input-type=module -e 'import { MAESTRO_VERSION } from "./scripts/mobile-e2e.mjs"; console.log(MAESTRO_VERSION)')" >> "$GITHUB_OUTPUT"
      - name: Cache Maestro
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kalia/maestro
          key: maestro-${{ runner.os }}-${{ steps.maestro.outputs.version }}
      - name: Install Maestro
        run: node scripts/mobile-e2e.mjs install-maestro
      # Gradle's dependencies and its own distribution. No restore-keys: the
      # android/ project is generated from app.json and the lockfile's React
      # Native, so a changed lockfile starts clean instead of restoring a
      # neighbour's cache.
      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'mobile/app.json', 'mobile/plugins/**') }}
      # x86_64 only: the emulator below is x86_64, and the other ABIs would
      # multiply the native compile for nothing.
      - name: Build the Android app with its JavaScript inside
        run: node scripts/mobile-e2e.mjs build --platform android --abi x86_64
      # The udev rule GitHub's changelog and the emulator action's README give
      # for hardware acceleration on the Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # API 36, Expo SDK 58's target. The API 37 image stayed `offline` in adb
      # for the whole 600 s boot timeout on this runner. The script owns the
      # emulator rather than an action: it waits for a healthy device, boots a
      # second time if the first never is, and names an infrastructure failure
      # as one.
      - name: Prepare the virtual device
        run: node scripts/mobile-e2e.mjs prepare-emulator
      - name: Run the Maestro flow on an emulator
        run: node scripts/mobile-e2e.mjs test --platform android --headless
      - name: Print the stack's logs
        if: failure()
        run: docker compose logs --no-color --tail 200 backend edge
      - name: Upload Maestro output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-output
          path: mobile/maestro-output/
          retention-days: 7

  ci-passed:
    name: CI passed
    # The check the branch ruleset requires, beside the vulnerability scan.
    # Requiring this one instead of each job means a new job is covered by
    # adding it to `needs`, with no ruleset change. A job the `changes`
    # filter skipped reports "skipped", which counts as a pass here.
    # always() so it still runs, and fails, when a needed job fails or is
    # cancelled: without it those make this job skip, and a skipped required
    # check lets the merge through.
    if: always()
    needs: [changes, static-checks, backend, web, mobile, mobile-e2e, api-client-drift, api-breaking-change, keycloak-realm-check, vulnerability-scan, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded or was skipped by the changes filter
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # `changes` must have succeeded: if it failed, every job gated on
          # it is skipped, and "skipped" would read as a pass.
          echo "$NEEDS" | jq -e '.changes.result == "success" and ([.[] | .result] | all(. == "success" or . == "skipped"))' > /dev/null
