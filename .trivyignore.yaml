# Debian's ssl-cert package ships this self-signed key in every image that
# installs it, postgres included, so that a service can start with TLS before
# it has a certificate. It is public and protects nothing; Trivy's secret
# scanner reports it as a private key.
secrets:
  - id: private-key
    paths:
      - /etc/ssl/private/ssl-cert-snakeoil.key
    statement: Debian ssl-cert's public self-signed snakeoil key in the postgres image, not a credential; ends when the image stops shipping it
    expired_at: 2026-12-01
