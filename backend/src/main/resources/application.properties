spring.application.name=kalia

# Environment-varying values are ${ENV_VAR:default} placeholders, never
# profile files (ADR-0015). Each default is the value that fails safest when
# nobody configures it: secrets get no default at all, exposure flags default
# to the restrictive setting, and connection targets default to localhost so
# a misconfigured deployment fails loudly instead of reaching something real.

spring.datasource.url=${DATABASE_JDBC_URL:jdbc:postgresql://localhost:5432/kalia}
spring.datasource.username=${DATABASE_USERNAME:kalia}
# Deliberately no default: an unset POSTGRES_PASSWORD must fail startup
# rather than fall back to a value that ships in the jar and actually works.
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway owns the schema; module-specific locations are added as modules land
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/catalog
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# RFC 9457 problem+json for MVC error responses (docs/architecture.md §4)
spring.mvc.problemdetails.enabled=true

# Omit null fields instead of serializing "field": null - matches the
# OpenAPI "optional" contract (springdoc requiredMode) and the generated
# frontend types (e.g. city?: string), where "absent" means "not present",
# not "present with value null".
spring.jackson.default-property-inclusion=non_null

# Published API documentation is an exposure surface, so it is off unless a
# deployment opts in. Enabled for local development in docker-compose.yml.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

# ADR-0013's per-environment levels: prod INFO (this default), dev DEBUG
# (docker-compose.yml), test WARN (failsafe configuration in pom.xml).
logging.level.fi.kalia=${LOG_LEVEL:INFO}
