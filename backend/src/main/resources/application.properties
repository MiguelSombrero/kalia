spring.application.name=kalia

# Environment-varying values are ${ENV_VAR:default} placeholders, never
# profile files (ADR-0015). Each default is the value that fails safest when
# nobody configures it: secrets get no default at all, exposure flags default
# to the restrictive setting, and connection targets default to localhost so
# a misconfigured deployment fails loudly instead of reaching something real.

spring.datasource.url=${DATABASE_JDBC_URL:jdbc:postgresql://localhost:5432/kalia}
spring.datasource.username=${DATABASE_USERNAME:kalia}
# Deliberately no default: an unset POSTGRES_PASSWORD must fail startup
# rather than fall back to a value that ships in the jar and actually works.
spring.datasource.password=${POSTGRES_PASSWORD}

# Flyway owns the schema; module-specific locations are added as modules land
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/catalog,classpath:db/migration/cellar
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# RFC 9457 problem+json for MVC error responses (docs/architecture.md §4)
spring.mvc.problemdetails.enabled=true

# Bearer-token validation (ADR-0028). Two addresses, not one: issuer-uri is
# the identity Keycloak stamps into every `iss` it issues, jwk-set-uri is
# where this process can actually reach it. They differ under docker-compose
# and that is why spring.security.oauth2.resourceserver.jwt.issuer-uri, which
# conflates them, is not used - see SecurityConfig.
kalia.auth.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/kalia}
kalia.auth.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/kalia/protocol/openid-connect/certs}
# The audience this API accepts; a token minted for another client of the
# same realm is rejected.
kalia.auth.audience=${KEYCLOAK_AUDIENCE:kalia-backend}
# Swagger UI's own Authorize button drives this pair directly (browser-facing,
# so issuer-uri's host-loopback address is right, unlike jwk-set-uri's).
kalia.auth.swagger-authorization-url=${kalia.auth.issuer-uri}/protocol/openid-connect/auth
kalia.auth.swagger-token-url=${kalia.auth.issuer-uri}/protocol/openid-connect/token

# Omit null fields instead of serializing "field": null - matches the
# OpenAPI "optional" contract (springdoc requiredMode) and the generated
# frontend types (e.g. city?: string), where "absent" means "not present",
# not "present with value null".
spring.jackson.default-property-inclusion=non_null

# Published API documentation is an exposure surface, so it is off unless a
# deployment opts in. Enabled for local development in docker-compose.yml.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}
# Pre-fills Swagger UI's Authorize dialog with its own Keycloak client
# (public, PKCE, no secret — keycloak/realm-export.json); the dialog never
# shows a client-secret field because kalia-swagger has none to enter.
springdoc.swagger-ui.oauth.client-id=${KEYCLOAK_SWAGGER_CLIENT_ID:kalia-swagger}
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true

# Actuator is an exposure surface, declared rather than inherited: Spring
# Boot's default happens to publish only health, but a dependency upgrade
# could widen it silently. health is published because CI's readiness gate
# and KaliaApplicationIT poll it; a monitored deployment can add its own
# (e.g. "health,metrics,prometheus").
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health}
# Health details name the components behind the check (database vendor,
# disk paths); the summary status is all an unauthenticated caller needs.
management.endpoint.health.show-details=never

# ADR-0013's per-environment levels: prod INFO (this default), dev DEBUG
# (docker-compose.yml), test WARN (failsafe configuration in pom.xml).
logging.level.fi.kalia=${LOG_LEVEL:INFO}
