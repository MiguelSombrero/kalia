# What only development has, merged over docker-compose.yml by a bare
# `docker compose` (ADR-0089). It is not part of the deployable definition,
# docker-compose.base.yml: nothing here may be needed to run that one.

services:
  # What a developer's host reaches directly. The deployable stack publishes
  # none of these three: the services dial them on the stack's network.
  postgres:
    ports:
      # Bound to localhost only: the database is never exposed beyond the dev machine.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  valkey:
    ports:
      # Bound to localhost only, same convention as the other services.
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"

  mailpit:
    # The local mail catcher for everything Keycloak sends. Nothing in this
    # stack ever talks to a real SMTP provider — docker-compose.dev.env points
    # the realm's SMTP settings at this container, and the e2e spec reads
    # caught messages back over the HTTP API. It is not in the deployable
    # definition: its API has no authentication.
    # Chosen over MailHog, which is effectively unmaintained upstream.
    image: axllent/mailpit:v1.33.0
    ports:
      # Bound to localhost only, same convention as the other services. 8025
      # is the web UI and HTTP API (container side; the host port is
      # MAILPIT_PORT); SMTP (1025) is reached only in-network as
      # mailpit:1025 and is not published.
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    environment:
      # This stack is the local development environment: verbose logs
      # (ADR-0013) and Swagger UI, both off by default elsewhere
      LOG_LEVEL: DEBUG
      SPRINGDOC_ENABLED: "true"
      # Where the observability profile's collector listens, set by `make
      # observability-up` and empty without it: a tier with no endpoint exports
      # nothing (ADR-0114).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OBSERVABILITY_OTLP_ENDPOINT:-}

  keycloak:
    depends_on:
      # Keycloak only dials mailpit when it actually sends a message, long
      # after startup — service_started is enough to order them.
      mailpit:
        condition: service_started
    environment:
      # The admin console's own address, served by the edge's admin port below.
      # Dev only: the deployable stack publishes no admin port (ADR-0090).
      KC_HOSTNAME_ADMIN: http://localhost:${KEYCLOAK_ADMIN_PORT:-8083}

  edge:
    ports:
      # Loopback only, and only here: phone mode never forwards it.
      - "127.0.0.1:${KEYCLOAK_ADMIN_PORT:-8083}:8083"

  web:
    environment:
      # Lets the dev AUTH_SECRET from docker-compose.dev.env through
      # verifyRequiredConfiguration, which refuses it everywhere else.
      KALIA_DEV_STACK: "true"
      # As for the backend: the profile's collector, or nothing.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OBSERVABILITY_OTLP_ENDPOINT:-}

  keycloak-config:
    environment:
      # The kalia-swagger client is a second file, not part of the deployable
      # realm. keycloak-config-cli imports files one after another and each
      # import deletes the clients its file does not list, so the dev file
      # only survives with deletion off. The deployable stack keeps the
      # default and so removes this client if a dev realm ever reached it.
      IMPORT_FILES_LOCATIONS: /config/kalia-realm.json,/config/kalia-realm-swagger.json
      IMPORT_MANAGED_CLIENT: no-delete
      # The backend's public address, for the kalia-swagger client's redirect
      # URI and web origin: Swagger UI is served from the host port. No
      # trailing slash, as for WEB_URL in the base.
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:${BACKEND_PORT:-8080}}
    volumes:
      - ./keycloak/realm-swagger.json:/config/kalia-realm-swagger.json:ro

  keycloak-seed:
    # node:26-alpine matches web/Dockerfile's build stage; the script
    # is dependency-free, so no image build is needed for this one-shot job.
    image: node:26-alpine
    depends_on:
      # Not just keycloak's healthcheck: the realm this seeds a user into
      # doesn't exist until keycloak-config has created it.
      keycloak-config:
        condition: service_completed_successfully
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      # What KC_HOSTNAME_ADMIN names; scripts/check-compose.mjs fails if not.
      KEYCLOAK_ADMIN_PUBLIC_URL: http://localhost:${KEYCLOAK_ADMIN_PORT:-8083}
      # The same values as docker-compose.dev.env, spelled out because this
      # file is interpolated without it; scripts/check-compose.mjs fails if
      # they ever differ.
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KALIA_DEV_ADMIN_PASSWORD: ${KALIA_DEV_ADMIN_PASSWORD:-testadmin123}
    volumes:
      - ./scripts/seed-keycloak-account.mjs:/seed-keycloak-account.mjs:ro
      # seed-keycloak-account.mjs imports its token-fetch/retry helper from
      # this file by relative path, so it needs mounting alongside it.
      - ./scripts/keycloak-admin.mjs:/keycloak-admin.mjs:ro
      # keycloak-admin.mjs imports its host-side address defaults from this
      # file; KEYCLOAK_URL and KEYCLOAK_ADMIN_URL are set here, so they go
      # unused in the container.
      - ./scripts/stack-ports.mjs:/stack-ports.mjs:ro
    # testuser stays an ordinary user; testadmin holds the admin role (ADR-0101).
    entrypoint:
      - sh
      - -c
      - node /seed-keycloak-account.mjs testuser testuser123 && node /seed-keycloak-account.mjs testadmin "$$KALIA_DEV_ADMIN_PASSWORD" admin

  # The observability profile (ADR-0114): started on request by `make
  # observability-up`, and absent from a bare `docker compose up`, so the
  # default stack runs exactly the containers it did before. Nothing here may
  # be needed to run docker-compose.base.yml. Every service in it carries the
  # profile; scripts/observability-profile.test.mjs fails if one does not.
  lgtm:
    # One container holds the OpenTelemetry collector, Prometheus, Loki, Tempo
    # and Grafana. The image declares no volume, so /data is a named one:
    # without it everything stored is lost with the container. Its first start
    # downloads about 600 MB of Grafana plugins into /data, which the volume
    # keeps; a stopped profile needs no network.
    profiles: [observability]
    image: grafana/otel-lgtm:0.41.0
    ports:
      # Grafana, bound to localhost only like every other published port. The
      # collector's OTLP ports (4317, 4318) are reached in-network as lgtm:4318.
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      # Anonymous visitors read and cannot write: the image's default role is
      # Admin, which lets one edit the data sources.
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Three days of data, set by arguments to each store, which the image
      # exposes and its configuration files do not. Loki's retention needs its
      # compactor on, and Loki exits before it is ready, naming nothing, on a
      # flag it does not accept: set ENABLE_LOGS_LOKI=true to read why.
      PROMETHEUS_EXTRA_ARGS: --storage.tsdb.retention.time=3d
      LOKI_EXTRA_ARGS: >-
        -compactor.retention-enabled=true
        -compactor.working-directory=/data/loki/compactor
        -compactor.delete-request-store=filesystem
        -store.retention=72h
      TEMPO_EXTRA_ARGS: >-
        -backend-worker.compaction.block-retention=72h
        -backend-scheduler.provider.work.compaction.block-retention=72h
    # The spike measured 1.0-1.2 GiB at work (ADR-0114).
    mem_limit: 2g
    volumes:
      - lgtm-data:/data
      # The image has no scrape job until a file of ours replaces its own.
      - ./observability/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
    healthcheck:
      # Grafana up and the data sources it provisions answering; a plugin
      # download on the first start can take minutes.
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 60

  alloy:
    # Ships every other container's stdout to Loki, so the edge, Keycloak,
    # Postgres and Valkey are in the store without an exporter of their own.
    # The Docker socket is mounted read-only, which does not stop it calling
    # the daemon's write API: that is why it runs only with the profile
    # (ADR-0114). The configuration finds only this Compose project's
    # containers, so one worktree's profile never ships another's logs.
    profiles: [observability]
    image: grafana/alloy:v1.22.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME}
    depends_on:
      lgtm:
        condition: service_healthy
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  lgtm-data:
