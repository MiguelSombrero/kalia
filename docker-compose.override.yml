# What only development has, merged over docker-compose.yml by a bare
# `docker compose` (ADR-0089). It is not part of the deployable definition,
# docker-compose.base.yml: nothing here may be needed to run that one.

services:
  # What a developer's host reaches directly. The deployable stack publishes
  # none of these three: the services dial them on the stack's network.
  postgres:
    ports:
      # Bound to localhost only: the database is never exposed beyond the dev machine.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  valkey:
    ports:
      # Bound to localhost only, same convention as the other services.
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"

  mailpit:
    # The local mail catcher for everything Keycloak sends. Nothing in this
    # stack ever talks to a real SMTP provider — docker-compose.dev.env points
    # the realm's SMTP settings at this container, and the e2e spec reads
    # caught messages back over the HTTP API. It is not in the deployable
    # definition: its API has no authentication.
    # Chosen over MailHog, which is effectively unmaintained upstream.
    image: axllent/mailpit:v1.32.0
    ports:
      # Bound to localhost only, same convention as the other services. 8025
      # is the web UI and HTTP API (container side; the host port is
      # MAILPIT_PORT); SMTP (1025) is reached only in-network as
      # mailpit:1025 and is not published.
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    environment:
      # This stack is the local development environment: verbose logs
      # (ADR-0013) and Swagger UI, both off by default elsewhere
      LOG_LEVEL: DEBUG
      SPRINGDOC_ENABLED: "true"

  keycloak:
    depends_on:
      # Keycloak only dials mailpit when it actually sends a message, long
      # after startup — service_started is enough to order them.
      mailpit:
        condition: service_started
    environment:
      # The admin console's own address, served by the edge's admin port below.
      # Dev only: the deployable stack publishes no admin port (ADR-0090).
      KC_HOSTNAME_ADMIN: http://localhost:${KEYCLOAK_ADMIN_PORT:-8083}

  edge:
    ports:
      # Loopback only, and only here: phone mode never forwards it.
      - "127.0.0.1:${KEYCLOAK_ADMIN_PORT:-8083}:8083"

  web:
    environment:
      # Lets the dev AUTH_SECRET from docker-compose.dev.env through
      # verifyRequiredConfiguration, which refuses it everywhere else.
      KALIA_DEV_STACK: "true"

  keycloak-config:
    environment:
      # The kalia-swagger client is a second file, not part of the deployable
      # realm. keycloak-config-cli imports files one after another and each
      # import deletes the clients its file does not list, so the dev file
      # only survives with deletion off. The deployable stack keeps the
      # default and so removes this client if a dev realm ever reached it.
      IMPORT_FILES_LOCATIONS: /config/kalia-realm.json,/config/kalia-realm-swagger.json
      IMPORT_MANAGED_CLIENT: no-delete
      # The backend's public address, for the kalia-swagger client's redirect
      # URI and web origin: Swagger UI is served from the host port. No
      # trailing slash, as for WEB_URL in the base.
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:${BACKEND_PORT:-8080}}
    volumes:
      - ./keycloak/realm-swagger.json:/config/kalia-realm-swagger.json:ro

  keycloak-seed:
    # node:26-alpine matches web/Dockerfile's build stage; the script
    # is dependency-free, so no image build is needed for this one-shot job.
    image: node:26-alpine
    depends_on:
      # Not just keycloak's healthcheck: the realm this seeds a user into
      # doesn't exist until keycloak-config has created it.
      keycloak-config:
        condition: service_completed_successfully
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      # What KC_HOSTNAME_ADMIN names; scripts/check-compose.mjs fails if not.
      KEYCLOAK_ADMIN_PUBLIC_URL: http://localhost:${KEYCLOAK_ADMIN_PORT:-8083}
      # The same values as docker-compose.dev.env, spelled out because this
      # file is interpolated without it; scripts/check-compose.mjs fails if
      # they ever differ.
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KALIA_DEV_ADMIN_PASSWORD: ${KALIA_DEV_ADMIN_PASSWORD:-testadmin123}
    volumes:
      - ./scripts/seed-keycloak-account.mjs:/seed-keycloak-account.mjs:ro
      # seed-keycloak-account.mjs imports its token-fetch/retry helper from
      # this file by relative path, so it needs mounting alongside it.
      - ./scripts/keycloak-admin.mjs:/keycloak-admin.mjs:ro
      # keycloak-admin.mjs imports its host-side address defaults from this
      # file; KEYCLOAK_URL and KEYCLOAK_ADMIN_URL are set here, so they go
      # unused in the container.
      - ./scripts/stack-ports.mjs:/stack-ports.mjs:ro
    # testuser stays an ordinary user; testadmin holds the admin role (ADR-0101).
    entrypoint:
      - sh
      - -c
      - node /seed-keycloak-account.mjs testuser testuser123 && node /seed-keycloak-account.mjs testadmin "$$KALIA_DEV_ADMIN_PASSWORD" admin
