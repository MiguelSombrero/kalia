name: kalia

services:
  backend:
    build: ./backend
    environment:
      # The app's own env contract (ADR-0015), not Spring property names
      DATABASE_JDBC_URL: jdbc:postgresql://postgres:5432/kalia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kalia}
      # This stack is the local development environment: verbose logs
      # (ADR-0013) and Swagger UI, both off by default elsewhere
      LOG_LEVEL: DEBUG
      SPRINGDOC_ENABLED: "true"
      # Two addresses for one Keycloak, the same split ADR-0025 records for
      # the frontend: the issuer is the identity stamped into every token
      # (KC_HOSTNAME below), while the JWKS fetch must dial the compose
      # network name because that public address is loopback-only on the
      # host. No depends_on for keycloak: the key set is fetched on the
      # first bearer token, not at startup, so the backend stays healthy
      # while Keycloak is still booting.
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/kalia
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/kalia/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Bound to localhost only, for local API access and Swagger UI
      # (docs/architecture.md §6). Authentication makes this a defence in
      # depth rather than the only protection, but the loopback binding
      # stays until a deployment story exists. Other services reach it as
      # http://backend:8080 regardless.
      - "127.0.0.1:8080:8080"
    healthcheck:
      # Asks the app whether it is ready, not merely whether the port is open:
      # -f fails the check on the 503 that /actuator/health returns when a
      # component (the database) is down, so dependants wait for readiness
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
      # The container listens on 0.0.0.0, which Auth.js would otherwise put
      # straight into redirect/form-action URLs it builds — that's not the
      # host the browser can reach, and our CSP's form-action 'self' then
      # silently blocks the mismatched-origin submission.
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET:-kalia-dev-auth-secret}
      AUTH_KEYCLOAK_ID: kalia-frontend
      AUTH_KEYCLOAK_SECRET: kalia-dev-secret
      # Keycloak's one public, canonical identity (matches KC_HOSTNAME
      # below) — every token/discovery-document/callback `iss` it issues
      # names this, so it's what Auth.js must validate against, even
      # though the frontend container can't actually dial it directly
      # (see AUTH_KEYCLOAK_INTERNAL_ORIGIN and auth.ts's customFetch).
      AUTH_KEYCLOAK_ISSUER: http://localhost:8081/realms/kalia
      # Where the frontend container actually reaches Keycloak — its
      # published port is loopback-only on the host, unreachable from
      # inside another container.
      AUTH_KEYCLOAK_INTERNAL_ORIGIN: http://keycloak:8080
      VALKEY_URL: redis://valkey:6379
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      valkey:
        condition: service_healthy

  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: kalia
      POSTGRES_USER: kalia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kalia}
    ports:
      # Bound to localhost only: the database is never exposed beyond the dev machine.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalia -d kalia"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    # start-dev: no external DB needed, state is ephemeral by design (the
    # realm below is reimported fresh on every start, see docs/tasks/iteration-4.md)
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # Fixed to the public address, not request-derived: Keycloak stamps
      # whichever hostname received a given request into the `iss` it
      # returns for that request, so without this, the browser (reaching
      # Keycloak via 127.0.0.1:8081) and the frontend container (reaching
      # it as keycloak:8080) would get inconsistent self-reported
      # identities — confirmed live: "unexpected iss (issuer) response
      # parameter value". Must match AUTH_KEYCLOAK_ISSUER above.
      KC_HOSTNAME: http://localhost:8081
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/kalia-realm.json:ro
    ports:
      # Bound to localhost only, same convention as the other services.
      # 8081, not 8080: the backend already publishes 8080 on the host.
      - "127.0.0.1:8081:8080"
    healthcheck:
      # The Keycloak image ships no curl/wget; /dev/tcp is bash's own probe.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9.1.1-alpine
    ports:
      # Bound to localhost only, same convention as the other services.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
