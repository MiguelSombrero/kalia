name: kalia

services:
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kalia
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-kalia}
    depends_on:
      postgres:
        condition: service_healthy
    # No published port: only the frontend is exposed (docs/architecture.md §6);
    # the API is reachable from other services as http://backend:8080.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080' "]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: kalia
      POSTGRES_USER: kalia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kalia}
    ports:
      # Bound to localhost only: the database is never exposed beyond the dev machine.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalia -d kalia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
