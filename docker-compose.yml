# The local stack, and what a bare `docker compose` runs (ADR-0089). It is the
# deployable definition plus the dev defaults: docker-compose.base.yml demands
# every secret, and docker-compose.dev.env supplies a dev value for each so
# `docker compose up` needs only the root .env's KALIA_FRONTEND_CLIENT_SECRET
# (README.md). docker-compose.override.yml, which Compose merges over this
# file, adds what only development has.
#
# The dev values go in through `env_file` rather than `${VAR:-default}` in an
# override: Compose interpolates each file on its own before merging, so a
# `:?` in the base would fail whatever an override sets. The root .env and the
# shell still win over dev.env, so a worktree's own ports and any value set by
# hand apply as before. Do not list .env here: an explicit env_file list
# replaces the project's .env, and Compose fails on a listed file that is
# missing.
#
# Needs a Docker Compose that supports `include` with `env_file`.
include:
  - path: docker-compose.base.yml
    env_file: docker-compose.dev.env
