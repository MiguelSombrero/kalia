name: kalia

services:
  backend:
    build: ./backend
    environment:
      # The app's own env contract (ADR-0015), not Spring property names
      DATABASE_JDBC_URL: jdbc:postgresql://postgres:5432/kalia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kalia}
      # This stack is the local development environment: verbose logs
      # (ADR-0013) and Swagger UI, both off by default elsewhere
      LOG_LEVEL: DEBUG
      SPRINGDOC_ENABLED: "true"
      # Two addresses for one Keycloak, the same split ADR-0025 records for
      # the frontend: the issuer is the identity stamped into every token
      # (KC_HOSTNAME below), while the JWKS fetch must dial the compose
      # network name because that public address is loopback-only on the
      # host. No depends_on for keycloak: the key set is fetched on the
      # first bearer token, not at startup, so the backend stays healthy
      # while Keycloak is still booting.
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/kalia
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/kalia/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Bound to localhost only, for local API access and Swagger UI
      # (docs/architecture.md §6). Authentication makes this a defence in
      # depth rather than the only protection, but the loopback binding
      # stays until a deployment story exists. Other services reach it as
      # http://backend:8080 regardless.
      - "127.0.0.1:8080:8080"
    healthcheck:
      # Asks the app whether it is ready, not merely whether the port is open:
      # -f fails the check on the 503 that /actuator/health returns when a
      # component (the database) is down, so dependants wait for readiness
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
      # The container listens on 0.0.0.0, which Auth.js would otherwise put
      # straight into redirect/form-action URLs it builds — that's not the
      # host the browser can reach, and our CSP's form-action 'self' then
      # silently blocks the mismatched-origin submission. Same value as
      # keycloak-config's FRONTEND_URL below (ADR-0054): they name the same
      # origin to two different consumers of it.
      AUTH_URL: ${FRONTEND_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-kalia-dev-auth-secret}
      AUTH_KEYCLOAK_ID: kalia-frontend
      # No default: this is the same secret keycloak-config-cli writes into
      # the kalia-frontend client below, and a wrong-but-present value fails
      # every sign-in far less legibly than compose refusing to start.
      AUTH_KEYCLOAK_SECRET: ${KALIA_FRONTEND_CLIENT_SECRET:?set KALIA_FRONTEND_CLIENT_SECRET in a root .env file, see README.md}
      # Keycloak's one public, canonical identity (matches KC_HOSTNAME
      # below) — every token/discovery-document/callback `iss` it issues
      # names this, so it's what Auth.js must validate against, even
      # though the frontend container can't actually dial it directly
      # (see AUTH_KEYCLOAK_INTERNAL_ORIGIN and auth.ts's customFetch).
      AUTH_KEYCLOAK_ISSUER: http://localhost:8081/realms/kalia
      # Where the frontend container actually reaches Keycloak — its
      # published port is loopback-only on the host, unreachable from
      # inside another container.
      AUTH_KEYCLOAK_INTERNAL_ORIGIN: http://keycloak:8080
      VALKEY_URL: redis://valkey:6379
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
      # Not just keycloak's own healthcheck: that reports healthy as soon as
      # Keycloak is up, before keycloak-config below has created the realm,
      # and Auth.js's OIDC discovery call would 404 in that window.
      keycloak-config:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: kalia
      POSTGRES_USER: kalia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kalia}
    ports:
      # Bound to localhost only: the database is never exposed beyond the dev machine.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      # Runs once, only against an empty data directory: creates the second
      # database Keycloak below persists into, alongside `kalia`.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalia -d kalia"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    build: ./keycloak
    # start (not start-dev): production mode, backed by the `keycloak`
    # database below so the realm survives a restart. No --import-realm:
    # the realm is owned by keycloak-config below, which (unlike
    # --import-realm) reconciles it on every boot rather than only the first.
    command: start --optimized
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: kalia
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-kalia}
      # Production mode defaults to requiring HTTPS; this stack is HTTP-only.
      KC_HTTP_ENABLED: "true"
      # Fixed to the public address, not request-derived: Keycloak stamps
      # whichever hostname received a given request into the `iss` it
      # returns for that request, so without this, the browser (reaching
      # Keycloak via 127.0.0.1:8081) and the frontend container (reaching
      # it as keycloak:8080) would get inconsistent self-reported
      # identities — confirmed live: "unexpected iss (issuer) response
      # parameter value". Must match AUTH_KEYCLOAK_ISSUER above. Also
      # satisfies production mode's requirement for either --hostname or
      # --hostname-strict false.
      KC_HOSTNAME: http://localhost:8081
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Bound to localhost only, same convention as the other services.
      # 8081, not 8080: the backend already publishes 8080 on the host.
      - "127.0.0.1:8081:8080"
    healthcheck:
      # The Keycloak image ships no curl/wget; /dev/tcp is bash's own probe.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30

  keycloak-config:
    # Applies keycloak/realm-export.json on every boot, reconciling an
    # already-populated realm rather than only creating it once (ADR-0054).
    image: quay.io/adorsys/keycloak-config-cli:6.5.1-26
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_USER: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # keycloak's own healthcheck (port 9000) can report ready a moment
      # before the admin REST API (port 8080) accepts admin/admin — the same
      # transient window seed-keycloak-account.mjs retries around. This is
      # this tool's own equivalent: it retries the connection itself instead
      # of failing the whole one-shot container on the first attempt.
      KEYCLOAK_AVAILABILITYCHECK_ENABLED: "true"
      KEYCLOAK_AVAILABILITYCHECK_TIMEOUT: 120s
      IMPORT_FILES_LOCATIONS: /config/kalia-realm.json
      # ADR-0054. Left on (the tool's default), the import is skipped whenever
      # the file's checksum is unchanged — so a setting changed in the admin
      # console is never reconciled back, on any boot. Off, every run is a full
      # diff/apply: that is what makes a restart (or `docker compose up -d
      # keycloak-config`) the recovery from drift, and what
      # scripts/check-keycloak-realm-config.mjs checks has not been skipped.
      IMPORT_CACHE_ENABLED: "false"
      IMPORT_VARSUBSTITUTION_ENABLED: "true"
      # Undefined-is-error is this tool's own default, kept explicit — see
      # ADR-0054's Alternatives/Evidence for why that property mattered here.
      IMPORT_VARSUBSTITUTION_UNDEFINEDISERROR: "true"
      # No trailing slash: concatenated directly into redirectUris/webOrigins
      # below and in scripts/check-keycloak-realm-config.mjs — a trailing
      # slash silently produces a double slash that both sides still agree
      # on, so nothing catches it.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      KEYCLOAK_SSL_REQUIRED: ${KEYCLOAK_SSL_REQUIRED:-none}
      KALIA_FRONTEND_CLIENT_SECRET: ${KALIA_FRONTEND_CLIENT_SECRET:?set KALIA_FRONTEND_CLIENT_SECRET in a root .env file, see README.md}
    volumes:
      - ./keycloak/realm-export.json:/config/kalia-realm.json:ro

  keycloak-seed:
    # node:24-alpine matches frontend/Dockerfile's build stage; the script
    # is dependency-free, so no image build is needed for this one-shot job.
    image: node:24-alpine
    depends_on:
      # Not just keycloak's healthcheck: the realm this seeds a user into
      # doesn't exist until keycloak-config above has created it.
      keycloak-config:
        condition: service_completed_successfully
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./scripts/seed-keycloak-account.mjs:/seed-keycloak-account.mjs:ro
    entrypoint: ["node", "/seed-keycloak-account.mjs", "testuser", "testuser123"]

  valkey:
    image: valkey/valkey:9.1.1-alpine
    ports:
      # Bound to localhost only, same convention as the other services.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
