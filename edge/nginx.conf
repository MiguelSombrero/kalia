worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;

    # Docker's embedded DNS, asked again every few seconds. The upstreams are
    # named in variables below so nginx resolves them per request: a name
    # resolved once at startup would pin a recreated container's old address,
    # and the proxy would not start at all while an upstream does not exist.
    resolver 127.0.0.11 valid=5s ipv6=off;

    limit_req_status 429;
    # The error log names the request line, query string included, and has no
    # format to change. A refusal is already in the access log as limit=REJECTED.
    limit_req_log_level info;

    # The request line without its query string (ADR-0013), from $request_uri
    # so an internal redirect cannot change what is logged the way it does $uri.
    map $request_uri $logged_path {
        ~^(?<path_only>[^?]*) $path_only;
        default "";
    }
    log_format edge '$remote_addr "$request_method $logged_path $server_protocol" '
                    '$status $body_bytes_sent '
                    'port=$server_port limit=$limit_req_status ms=$msec len=$request_length';
    access_log /dev/stdout edge;

    # One zone per kind of request, each keyed by the client address, because
    # a flood of page loads must not use up the budget for registrations.
    # Rates and bursts are ADR-0090's, sized from what the e2e suite does from
    # its single address.
    #
    # A registration is counted only when it is submitted: the key is empty,
    # which limit_req does not count, for every other method.
    map $request_method $registration_submitter {
        POST $binary_remote_addr;
        default "";
    }
    limit_req_zone $registration_submitter zone=registration:10m rate=6r/m;
    limit_req_zone $binary_remote_addr zone=logout:1m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=keycloak:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=web:10m rate=150r/s;
    limit_req_zone $binary_remote_addr zone=static:10m rate=150r/s;
    limit_req_zone $binary_remote_addr zone=backend:10m rate=10r/s;

    # Every request reaching an upstream names the address the socket came
    # from, replacing whatever the caller sent: this proxy is the outermost
    # hop, so nothing before it is to be believed. Keycloak, Spring and the
    # web app read it, and are reachable only through here (ADR-0090).
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Connection "";

    # Answers the compose healthcheck; not published.
    server {
        listen 8099;
        access_log off;
        location / {
            return 200 "ok\n";
        }
    }

    # The web app, port 3000.
    server {
        listen 3000;
        client_max_body_size 1m;
        set $upstream http://web:3000;
        # Server components stream; buffering would hold the shell back.
        proxy_buffering off;

        # Keycloak posts a Logout Token here server to server, over the
        # compose network. An internet caller has no business with more than
        # the token's few kilobytes (the route enforces the same cap itself).
        location = /api/auth/backchannel-logout {
            client_max_body_size 16k;
            limit_req zone=logout burst=10 nodelay;
            proxy_pass $upstream;
        }

        location /_next/static/ {
            proxy_buffering on;
            limit_req zone=static burst=400 nodelay;
            proxy_pass $upstream;
        }

        location / {
            limit_req zone=web burst=300 nodelay;
            proxy_pass $upstream;
        }
    }

    # The backend API, port 8080.
    server {
        listen 8080;
        client_max_body_size 64k;
        set $upstream http://backend:8080;

        location / {
            limit_req zone=backend burst=30 nodelay;
            proxy_pass $upstream;
        }
    }

    # Keycloak, port 8081.
    server {
        listen 8081;
        client_max_body_size 256k;
        set $upstream http://keycloak:8080;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;

        # Self-registration: the form and its submission. A script posting to
        # these bypasses Kalia's own button, which is why the limit is here.
        location ~ ^/realms/[^/]+/(protocol/openid-connect/registrations|login-actions/registration)$ {
            limit_req zone=registration burst=20 nodelay;
            limit_req zone=keycloak burst=60 nodelay;
            proxy_pass $upstream;
        }

        location /resources/ {
            limit_req zone=static burst=400 nodelay;
            proxy_pass $upstream;
        }

        location / {
            limit_req zone=keycloak burst=60 nodelay;
            proxy_pass $upstream;
        }
    }
}
