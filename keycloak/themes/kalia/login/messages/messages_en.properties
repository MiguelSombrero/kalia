# Overrides base/login's deliberately generic accountTemporarilyDisabledMessage
# (ADR-0061): Kalia tells a locked-out visitor so, since the account name
# behind the lockout is not secret here.
accountTemporarilyDisabledMessage=Too many failed sign-in attempts. Please try again in a few minutes.

# The page <title>, one per Keycloak page, keyed by the page's id as template.ftl
# reads it. A page with no key here keeps Keycloak's own title.
kaliaTitle-login=Sign in to Kalia
kaliaTitle-register=Create a Kalia account
kaliaTitle-login-reset-password=Forgot your password?
kaliaTitle-login-update-password=Choose a new password
kaliaTitle-login-verify-email=Confirm your email address
kaliaTitle-error=Something went wrong
