# Overrides base/login's deliberately generic accountTemporarilyDisabledMessage
# (ADR-0061): Kalia tells a locked-out visitor so, since the account name
# behind the lockout is not secret here.
accountTemporarilyDisabledMessage=Liian monta epäonnistunutta kirjautumisyritystä. Yritä uudelleen muutaman minuutin kuluttua.

# The page <title>, one per Keycloak page, keyed by the page's id as template.ftl
# reads it. A page with no key here keeps Keycloak's own title.
kaliaTitle-login=Kirjaudu Kaliaan
kaliaTitle-register=Luo Kalia-tili
kaliaTitle-login-reset-password=Unohtuiko salasana?
kaliaTitle-login-update-password=Valitse uusi salasana
kaliaTitle-login-verify-email=Vahvista sähköpostiosoitteesi
kaliaTitle-error=Jotain meni vikaan
