# Kalia login theme — stock keycloak.v2 plus a logo and a small stylesheet
# override, nothing more (ADR-0056). keycloak.v2's own styles.css stays on the
# list; login.css is layered after it and only touches the theme's documented
# CSS custom properties (--keycloak-logo-url, --keycloak-card-top-color) plus
# the cream page background and the mint primary button.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/login.css

# Kalia is light-mode only (ADR-0021); disable keycloak.v2's dark-mode swap so
# the cream palette below is what every visitor sees.
darkMode=false
