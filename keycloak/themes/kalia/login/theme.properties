# ADR-0056, as amended by ADR-0073; the one message override is ADR-0061.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/login.css

# Do not drop the PatternFly class from either key: it carries PatternFly's
# whole login layout, which login.css only adjusts through the Kalia class.
kcLogin=pf-v5-c-login kalia-login
kcLoginContainer=pf-v5-c-login__container kalia-container

# Kalia is light-mode only (ADR-0021); disable keycloak.v2's dark-mode swap so
# the palette in login.css is what every visitor sees.
darkMode=false
