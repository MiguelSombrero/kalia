# The image's own configuration with the stack's scrape jobs added: its
# Prometheus has no job of its own. Mounted over /otel-lgtm/prometheus.yaml by
# the observability profile (docker-compose.override.yml).
---
global:
  scrape_native_histograms: true
scrape_configs:
  # The backend's counters, read inside the compose network without a
  # credential: the edge answers 404 on this path, so the network is the
  # boundary (ADR-0088).
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
  # The web's counters, which survive here the restart that resets them in the
  # process (ADR-0088). The bearer is METRICS_TOKEN from
  # docker-compose.dev.env, a dev-only value; scripts/observability-scrape.test.mjs
  # fails if the two differ.
  - job_name: web
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials: kalia-dev-metrics-token
    static_configs:
      - targets: ["web:3000"]
  # Keycloak's own counters, on the management port its healthcheck uses. No
  # host port reaches it. Built in only for the local stack
  # (docker-compose.override.yml).
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: ["keycloak:9000"]
  # Postgres and Valkey are read through exporters that run only with the
  # profile, so there is a job for each rather than a port on either service.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: valkey
    static_configs:
      - targets: ["redis-exporter:9121"]
otlp:
  keep_identifying_resource_attributes: true
  # Recommended attributes to be promoted to labels.
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment # backward compatibility
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - database # used by otelcol/receiver/mongodb
    - kafka.cluster.alias
storage:
  tsdb:
    # A 10min time window is enough because it can easily absorb retries and network delays.
    out_of_order_time_window: 10m
